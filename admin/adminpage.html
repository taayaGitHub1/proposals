<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="adminpage.css">

<body>
    <div class="container">
        <div class="sidebar">

            <div class="sidebar-brand">
                <h1><i class="fa-solid fa-seedling"></i>Eco-Planet</h1>
            </div>

            <div class="sidebar-menu">
                <ul>
                    <li>
                        <a href="" class="active"><i class="fa-solid fa-igloo"></i><span>Dashboard</span></a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-user"></i><span>Customers</span></a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-truck-moving"></i><span>Orders</span></a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-box"></i><span>Inventory</span></a>
                    </li>
                    <li>
                        <a href=""><i class="fa-regular fa-circle-user"></i><span>Accounts</span></a>
                    </li>
                    <li>
                        <a href=""><i class="fa-solid fa-clipboard-list"></i><span>Tasks</span></a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="main-content"></div>
        <header>
            <h1><label for="">
                    <i class="fa-solid fa-bars"></i>
                </label>
                Dashboard
            </h1>
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="Search here..." />
            </div>
            <div class="user-wrapper">
                <img src="" alt="admin">
                <div>
                    <h4>HAHA</h4>
                    <small>Super Admin</small>
                </div>
            </div>
        </header>
        <main>
            <div class="cards">
                <div class="card-single">
                    <div>
                        <h1>54</h1>
                        <span>Customers</span>
                    </div>
                    <div>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="card-single">
                    <div>
                        <h1>4</h1>
                        <span>Projects</span>
                    </div>
                    <div>
                        <i class="fa-solid fa-clipboard-list"></i>
                    </div>
                </div>

                <div class="card-single">
                    <div>
                        <h1>5</h1>
                        <span>Orders</span>
                    </div>
                    <div>
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>
                </div>

                <div class="card-single">
                    <div>
                        <h1>54</h1>
                        <span>Income</span>
                    </div>
                    <div>
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                </div>
            </div>
            <div class="recent-grid">
                <div class="projects">
                    <div class="card">
                        <div class="card_header"></div>
                        <div class="card-body"></div>

                    </div>
                </div>
                <div class="customers">

                </div>

            </div>
        </main>
    </div>

</html>
