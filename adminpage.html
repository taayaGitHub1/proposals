<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet"
        href="https://maxst.icons8.com/vue-static/landings/line-awesome/font-awesome-line-awesome/css/all.min.css">
    <link rel="stylesheet" href="adminpage.css">

<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <h1><span class="lab Eco-Planet"></span>Eco-Planet</h1>
        </div>
        <div class="sidebar-menu">
            <ul>
                <li>
                    <a href="" class="active"><span class="la la-igloo"></span><span>Dashboard</span></a>
                </li>
                <li>
                    <a href=""><span class="las la-users"></span><span>Customers</span></a>
                </li>
                <li>
                    <a href=""><span class="las la-shipping-bag"></span><span>Orders</span></a>
                </li>
                <li>
                    <a href=""><span class="las la-receipt"></span><span>Inventory</span></a>
                </li>
                <li>
                    <a href=""><span class="las la-users-cirlce"></span><span>Accounts</span></a>
                </li>
                <li>
                    <a href=""><span class="las la-clipboard-list"></span><span>Tasks</span></a>
                </li>
            </ul>
        </div>
    </div>

    <div class="main-content"></div>
    <header>
        <h1><label for="">
                <span class="las la-bars"></span>
            </label>
            Dashboard
        </h1>
        <div class="search-wrapper">
            <span class="las la-search"></span>
            <input type="search" placeholder="Search here..." />
        </div>
        <div class="user-wrapper">
            <img src="" alt="admin">
            <div>
                <h4>HAHA</h4>
                <small>Super Admin</small>
            </div>
        </div>
    </header>
    <main>
        <div class="cards">
            <div class="card-single">
                <div>
                    <h1>54</h1>
                    <span>Customers</span>
                </div>
                <div>
                    <span class="las la-users"></span>
                </div>
            </div>

            <div class="card-single">
                <div>
                    <h1>4</h1>
                    <span>Projects</span>
                </div>
                <div>
                    <span class="las la-clipboard-list"></span>
                </div>
            </div> 
            
            <div class="card-single">
                <div>
                    <h1>5</h1>
                    <span>Orders</span>
                </div>
                <div>
                    <span class="las la-shopping-bag"></span>
                </div>
            </div>

            <div class="card-single">
                <div>
                    <h1>54</h1>
                    <span>Income</span>
                </div>
                <div>
                    <span class="las la-google-wallet"></span>
                </div>
            </div>
        </div>
    </main>

</html>
