<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div id="container" class="container">
        <div class="LoginPage-container" class="container">
            <h1>Login Page</h1>
            <br><input type="email" name="email" id="email" placeholder="E-mail">
            <br><input type="password" name="password" id="password" placeholder="Password">
            <br><br>
            <button>Login</button>
            <p>New here? <a href="register.html">Register here...</a></p>
        </div>
        <div class="Register-container" class="container">
            <h1>Register</h1>
            <form action="login.html">
                <br> <input type="text" name="name" id="name" placeholder="Name">
                <input type="email" name="email" id="email" placeholder=" Email">
                <input type="password" name="password" id="password" placeholder=" Password">
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm Password">
                <br> <br>
                <button> Register</button>
            </form>
        </div>

                        <!-- overlay container -->
        
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>
                        To keep connected with us please login with your personal info
                    </p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start journey with us</p>
                    <button class="ghost" id="signUp">Sign Up</button>
                </div>
              
            </div>
        </div>
    </div>
</body>

</html>
